<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amine Rent a Car - Réservation en ligne</title>

  <!-- FontAwesome Icons & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-color: #d62839;
      --primary-dark: #a91d2b;
      --secondary-color: #14213d;
      --accent-color: #2a9d8f;
      --gold-accent: #e9b44c;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #2b2d42;
      --muted-text: #6c757d;
      --border-color: #e2e8f0;
      --border-radius: 12px;
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #14213d 45%, #1e293b 100%);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatEffect {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .booking-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 850px;
      border-radius: var(--border-radius);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      padding: 40px;
      animation: fadeInUp 0.8s ease-out;
      position: relative;
      overflow: hidden;
      border-top: 5px solid var(--primary-color);
    }

    .booking-header {
      text-align: center;
      margin-bottom: 35px;
    }

    .booking-header h2 {
      color: var(--secondary-color);
      font-weight: 700;
      font-size: 2.2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      position: relative;
      display: inline-block;
    }

    .booking-header h2 i {
      color: var(--primary-color);
      margin-right: 8px;
    }

    .booking-header h2::after {
      content: '';
      width: 60%;
      height: 4px;
      background: linear-gradient(90deg, var(--primary-color), var(--gold-accent));
      position: absolute;
      bottom: -8px;
      left: 20%;
      border-radius: 2px;
    }

    .booking-header p {
      color: var(--muted-text);
      margin-top: 12px;
      font-size: 0.95rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .booking-container { padding: 25px; }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    @media (max-width: 768px) {
      .form-group.full-width { grid-column: span 1; }
    }

    .form-group label {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: var(--secondary-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i.icon-prefix {
      position: absolute;
      left: 14px;
      color: var(--accent-color);
      font-size: 1.1rem;
      transition: var(--transition);
      pointer-events: none;
    }

    .form-control {
      width: 100%;
      padding: 12px 15px 12px 42px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      transition: var(--transition);
      outline: none;
      background: #f8fafc;
    }

    .form-control:focus {
      border-color: var(--primary-color);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(214, 40, 57, 0.15);
    }

    .form-control:focus + i.icon-prefix {
      color: var(--primary-color);
    }

    .form-control.input-error {
      border-color: var(--primary-color);
      animation: shake 0.4s ease;
    }

    /* Honeypot anti-bot (invisible pour les humains) */
    .hp-field {
      position: absolute;
      left: -9999px;
      top: -9999px;
      opacity: 0;
      pointer-events: none;
      tab-index: -1;
    }

    /* Phone Input Flag Styling */
    .flag-badge {
      position: absolute;
      right: 12px;
      font-size: 1.4rem;
      pointer-events: none;
      transition: var(--transition);
      animation: floatEffect 2s infinite;
    }

    /* Compteur de jours */
    .duration-badge {
      margin-top: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent-color);
      display: none;
      align-items: center;
      gap: 6px;
    }

    .duration-badge.show {
      display: flex;
    }

    .field-hint {
      font-size: 0.78rem;
      color: var(--primary-color);
      margin-top: 6px;
      display: none;
    }

    .field-hint.show {
      display: block;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(214, 40, 57, 0.35);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Custom Notification Alert */
    .alert-box {
      display: none;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      font-weight: 500;
      text-align: center;
      animation: fadeInUp 0.4s ease;
    }

    .alert-success {
      background-color: #d1e7dd;
      color: #0f5132;
      border: 1px solid #badbcc;
    }

    .alert-danger {
      background-color: #f8d7da;
      color: #842029;
      border: 1px solid #f5c2c7;
    }
  </style>
</head>
<body>

  <div class="booking-container">
    <div class="booking-header">
      <h2><i class="fa-solid fa-car"></i> Amine Rent a Car</h2>
      <p>Réservez votre véhicule en toute sécurité en quelques clics</p>
    </div>

    <form id="reservationForm" autocomplete="off">
      <div class="form-grid">

        <!-- Nom & Prénom -->
        <div class="form-group">
          <label for="fullName"><i class="fa-solid fa-user"></i> Nom et Prénom</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user icon-prefix"></i>
            <input type="text" id="fullName" class="form-control" placeholder="ex: Ahmed Ben Ali" required minlength="3" maxlength="60" pattern="[A-Za-zÀ-ÿ\s\-']{3,60}">
          </div>
          <span class="field-hint" id="nameHint">Le nom doit contenir au moins 3 lettres.</span>
        </div>

        <!-- Téléphone avec Drapeau Dynamique -->
        <div class="form-group">
          <label for="phone"><i class="fa-solid fa-phone"></i> Téléphone</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-phone icon-prefix"></i>
            <input type="tel" id="phone" class="form-control" placeholder="+216 22 123 456" required maxlength="18">
            <span id="flagContainer" class="flag-badge"></span>
          </div>
          <span class="field-hint" id="phoneHint">Numéro invalide (8 à 15 chiffres).</span>
        </div>

        <!-- Choix de la voiture -->
        <div class="form-group">
          <label for="carSelect"><i class="fa-solid fa-car-side"></i> Véhicule</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-car-side icon-prefix"></i>
            <select id="carSelect" class="form-control" required>
              <option value="" disabled selected>Choisir une voiture...</option>
              <option value="Seat Ibiza">Seat Ibiza</option>
              <option value="Hyundai i20">Hyundai i20</option>
              <option value="Škoda Fabia">Škoda Fabia</option>
              <option value="Dacia Sandero Stepway">Dacia Sandero Stepway</option>
              <option value="Suzuki Swift">Suzuki Swift</option>
              <option value="Kia Picanto">Kia Picanto</option>
              <option value="BYD Song Plus">BYD Song Plus</option>
              <option value="Kia Sportage">Kia Sportage</option>
              <option value="Jaguar F-Pace">Jaguar F-Pace</option>
              <option value="Mercedes-Benz C200 AMG">Mercedes-Benz C200 AMG</option>
              <option value="Land Rover Defender">Land Rover Defender</option>
            </select>
          </div>
        </div>

        <!-- Agence de prise -->
        <div class="form-group">
          <label for="agencySelect"><i class="fa-solid fa-location-dot"></i> Agence de départ</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-location-dot icon-prefix"></i>
            <select id="agencySelect" class="form-control" required>
              <option value="Cité Ezzouhour 4">Cité Ezzouhour 4</option>
              <option value="Le Bardo (Route X)">Le Bardo (Route X)</option>
              <option value="Yasmine Hammamet">Yasmine Hammamet</option>
            </select>
          </div>
        </div>

        <!-- Date Début (sécurisée) -->
        <div class="form-group">
          <label for="startDate"><i class="fa-solid fa-calendar-day"></i> Date de début</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-calendar-day icon-prefix"></i>
            <input type="date" id="startDate" class="form-control" required>
          </div>
          <span class="field-hint" id="startHint">La date de début ne peut pas être dans le passé.</span>
        </div>

        <!-- Date Fin (sécurisée) -->
        <div class="form-group">
          <label for="endDate"><i class="fa-solid fa-calendar-check"></i> Date de fin</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-calendar-check icon-prefix"></i>
            <input type="date" id="endDate" class="form-control" required>
          </div>
          <span class="field-hint" id="endHint">La date de fin doit être après la date de début.</span>
          <span class="duration-badge" id="durationBadge"><i class="fa-solid fa-clock"></i> <span id="durationText"></span></span>
        </div>

        <!-- Remarques -->
        <div class="form-group full-width">
          <label for="notes"><i class="fa-solid fa-comment-dots"></i> Remarques particulières</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-comment-dots icon-prefix" style="top: 15px; align-self: flex-start;"></i>
            <textarea id="notes" class="form-control" style="padding-left: 42px; height: 90px; resize: none;" placeholder="Besoins spécifiques, heure d'arrivée..." maxlength="500"></textarea>
          </div>
        </div>

        <!-- Honeypot anti-bot : champ invisible, ne jamais le remplir -->
        <div class="form-group hp-field" aria-hidden="true">
          <label for="website">Website</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>

      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        <span>Confirmer la réservation</span>
        <i class="fa-solid fa-paper-plane"></i>
      </button>

      <div id="alertMessage" class="alert-box"></div>
    </form>
  </div>

  <script>
    // URL de ton Google Apps Script Web App (déploiement "exec")
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz2tEVcArewBVIH4PkJXu7CX88HaNrDGz-IrNhqERqQew-SDI0OxsxESW1wq67zt6O7PQ/exec";

    document.addEventListener("DOMContentLoaded", function () {
      const startDateInput = document.getElementById("startDate");
      const endDateInput = document.getElementById("endDate");
      const phoneInput = document.getElementById("phone");
      const nameInput = document.getElementById("fullName");
      const flagContainer = document.getElementById("flagContainer");
      const form = document.getElementById("reservationForm");
      const submitBtn = document.getElementById("submitBtn");
      const alertMsg = document.getElementById("alertMessage");
      const durationBadge = document.getElementById("durationBadge");
      const durationText = document.getElementById("durationText");
      const startHint = document.getElementById("startHint");
      const endHint = document.getElementById("endHint");
      const nameHint = document.getElementById("nameHint");
      const phoneHint = document.getElementById("phoneHint");
      const honeypot = document.getElementById("website");

      // ====== 1. Bornes des dates : aujourd'hui -> aujourd'hui + 2 ans ======
      // Empêche de choisir une date passée OU une année absurde (ex: 2164)
      const now = new Date();
      const todayStr = now.toISOString().split("T")[0];

      const maxDate = new Date(now);
      maxDate.setFullYear(maxDate.getFullYear() + 2);
      const maxDateStr = maxDate.toISOString().split("T")[0];

      startDateInput.min = todayStr;
      startDateInput.max = maxDateStr;
      endDateInput.min = todayStr;
      endDateInput.max = maxDateStr;

      // Vérifie qu'une date saisie/tapée est bien une date réelle et dans les bornes autorisées
      function isValidBoundedDate(value) {
        if (!value) return false;
        // Format attendu strictement YYYY-MM-DD
        if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
        const d = new Date(value + "T00:00:00");
        if (isNaN(d.getTime())) return false;
        const minD = new Date(todayStr + "T00:00:00");
        const maxD = new Date(maxDateStr + "T00:00:00");
        return d >= minD && d <= maxD;
      }

      function calcDuration() {
        durationBadge.classList.remove("show");
        if (startDateInput.value && endDateInput.value) {
          const d1 = new Date(startDateInput.value + "T00:00:00");
          const d2 = new Date(endDateInput.value + "T00:00:00");
          const diffDays = Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
          if (diffDays > 0) {
            durationText.textContent = diffDays + (diffDays === 1 ? " jour de location" : " jours de location");
            durationBadge.classList.add("show");
          }
        }
      }

      function validateDates() {
        let ok = true;
        startHint.classList.remove("show");
        endHint.classList.remove("show");
        startDateInput.classList.remove("input-error");
        endDateInput.classList.remove("input-error");

        // Corrige/rejette toute valeur hors bornes (blocage anti-année-fantaisiste + anti-date passée)
        if (startDateInput.value && !isValidBoundedDate(startDateInput.value)) {
          startDateInput.value = "";
          startDateInput.classList.add("input-error");
          startHint.classList.add("show");
          ok = false;
        }
        if (endDateInput.value && !isValidBoundedDate(endDateInput.value)) {
          endDateInput.value = "";
          endDateInput.classList.add("input-error");
          endHint.classList.add("show");
          ok = false;
        }

        // La date de fin doit toujours être après la date de début
        if (startDateInput.value) {
          endDateInput.min = startDateInput.value;
          if (endDateInput.value && endDateInput.value < startDateInput.value) {
            endDateInput.classList.add("input-error");
            endHint.classList.add("show");
            endDateInput.value = "";
            ok = false;
          }
        }

        calcDuration();
        return ok;
      }

      startDateInput.addEventListener("change", validateDates);
      startDateInput.addEventListener("input", validateDates);
      endDateInput.addEventListener("change", validateDates);
      endDateInput.addEventListener("input", validateDates);

      // ====== 2. Détection de l'indicatif téléphonique ======
      phoneInput.addEventListener("input", function () {
        const val = phoneInput.value.trim();
        if (val.startsWith("+216") || val.startsWith("00216") || val.startsWith("216")) {
          flagContainer.textContent = "🇹🇳";
        } else if (val.startsWith("+33") || val.startsWith("0033")) {
          flagContainer.textContent = "🇫🇷";
        } else if (val.startsWith("+39") || val.startsWith("0039")) {
          flagContainer.textContent = "🇮🇹";
        } else if (val.startsWith("+")) {
          flagContainer.textContent = "🌐";
        } else {
          flagContainer.textContent = "";
        }
        phoneInput.classList.remove("input-error");
        phoneHint.classList.remove("show");
      });

      nameInput.addEventListener("input", function () {
        nameInput.classList.remove("input-error");
        nameHint.classList.remove("show");
      });

      // ====== 3. Nettoyage anti-XSS ======
      function sanitizeInput(str) {
        return String(str).replace(/[&<>"']/g, function (m) {
          return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
          }[m];
        });
      }

      function showAlert(message, type) {
        alertMsg.className = `alert-box alert-${type}`;
        alertMsg.textContent = message;
        alertMsg.style.display = "block";
      }

      // ====== 4. Anti-spam : empêche l'envoi répété en rafale ======
      let lastSubmitTime = 0;
      const SUBMIT_COOLDOWN_MS = 15000; // 15 secondes entre deux envois

      // ====== 5. Soumission du formulaire et envoi par email ======
      form.addEventListener("submit", function (e) {
        e.preventDefault();

        // Honeypot rempli = très probablement un bot -> on bloque silencieusement
        if (honeypot && honeypot.value.trim() !== "") {
          showAlert("Une erreur s'est produite. Veuillez réessayer.", "danger");
          return;
        }

        // Anti double-envoi rapide
        const now2 = Date.now();
        if (now2 - lastSubmitTime < SUBMIT_COOLDOWN_MS) {
          showAlert("Veuillez patienter quelques secondes avant de renvoyer une demande.", "danger");
          return;
        }

        let valid = true;

        // Validation du nom
        if (!nameInput.value.trim() || nameInput.value.trim().length < 3) {
          nameInput.classList.add("input-error");
          nameHint.classList.add("show");
          valid = false;
        }

        // Validation du téléphone
        const phoneRegex = /^[+]?[0-9\s\-]{8,15}$/;
        if (!phoneRegex.test(phoneInput.value.trim())) {
          phoneInput.classList.add("input-error");
          phoneHint.classList.add("show");
          valid = false;
        }

        // Re-validation stricte des dates (bloque toute manipulation manuelle du champ)
        if (!isValidBoundedDate(startDateInput.value) || !isValidBoundedDate(endDateInput.value)) {
          valid = false;
        }
        if (startDateInput.value && endDateInput.value && endDateInput.value <= startDateInput.value) {
          endDateInput.classList.add("input-error");
          endHint.classList.add("show");
          valid = false;
        }

        if (!valid) {
          showAlert("Veuillez corriger les champs indiqués en rouge.", "danger");
          return;
        }

        // Désactiver le bouton pendant l'envoi
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span>Envoi en cours...</span> <i class="fa-solid fa-spinner fa-spin"></i>`;

        const d1 = new Date(startDateInput.value + "T00:00:00");
        const d2 = new Date(endDateInput.value + "T00:00:00");
        const nbJours = Math.round((d2 - d1) / (1000 * 60 * 60 * 24));

        // Préparation des données nettoyées
        const reservationData = {
          client_name: sanitizeInput(nameInput.value.trim()),
          client_phone: sanitizeInput(phoneInput.value.trim()),
          car_model: sanitizeInput(document.getElementById("carSelect").value),
          agency: sanitizeInput(document.getElementById("agencySelect").value),
          start_date: startDateInput.value,
          end_date: endDateInput.value,
          duration_days: nbJours,
          notes: sanitizeInput(document.getElementById("notes").value.trim() || "Aucune")
        };

        /*
           Google Apps Script Web App :
           - Le formulaire envoie les données à GOOGLE_SCRIPT_URL (défini en haut du script).
           - Le script Apps Script (côté Google) ajoute la ligne dans Google Sheets ET
             envoie l'email de notification (voir le code Apps Script fourni séparément).
           - mode: "no-cors" est obligatoire ici car Apps Script ne gère pas les requêtes
             preflight CORS proprement -> du coup on ne peut pas lire la vraie réponse
             (elle est "opaque"). On considère l'envoi réussi si fetch() ne plante pas
             au niveau réseau. Pour vérifier réellement que ça marche, va checker ton
             Google Sheet après un test.
        */
        fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(reservationData)
        })
          .then(function () {
            lastSubmitTime = Date.now();
            showAlert("Votre demande de réservation a été envoyée avec succès ! Nous vous contacterons sous 60 min.", "success");
            form.reset();
            flagContainer.textContent = "";
            durationBadge.classList.remove("show");
            startDateInput.min = todayStr;
            startDateInput.max = maxDateStr;
            endDateInput.min = todayStr;
            endDateInput.max = maxDateStr;
          })
          .catch(function (error) {
            console.error("Échec de l'envoi vers Google Sheets :", error);
            showAlert("Une erreur s'est produite lors de l'envoi. Veuillez réessayer ou nous contacter directement.", "danger");
          })
          .finally(function () {
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<span>Confirmer la réservation</span> <i class="fa-solid fa-paper-plane"></i>`;
          });
      });
    });
  </script>
</body>
</html>

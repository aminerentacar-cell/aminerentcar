<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Amine Rent A Car</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--ink:#1C1F22;--red:#D62828;--green:#2FAE60;--gold:#C9A227;--line:#d9dad6}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:#F1F2F0;color:#202225}
header{background:var(--ink);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
input,select{padding:9px;border:1.5px solid var(--line);border-radius:8px;font:inherit;width:100%}
button{border:0;border-radius:8px;padding:9px 13px;font:600 14px inherit;color:#fff;background:var(--ink);cursor:pointer}
.g{background:var(--green)}.r{background:var(--red)}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{background:#fff;color:var(--ink);border:1px solid var(--line)}.tabs .on{background:var(--ink);color:#fff}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;color:#fff}
.pending{background:var(--gold);color:#000}.confirmed{background:var(--green)}.cancelled,.expired{background:#888}.cancellation_requested{background:#e67e22}.blocked{background:#555}
.msg{color:var(--red);font-weight:600;margin:8px 0}.small{color:#63676b;font-size:13px}
.vrow{display:grid;grid-template-columns:1fr 110px 120px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
@media(max-width:700px){.vrow{grid-template-columns:1fr 1fr}}
[hidden]{display:none!important}
</style></head>
<body>
<header><b>AMINE RENT A CAR : Admin</b><button id="out" hidden>Déconnexion</button></header>
<main>
<div class="card" id="login" style="max-width:400px;margin:40px auto">
  <h2 style="margin-top:0">Connexion</h2>
  <p><input id="em" type="email" placeholder="E-mail" autocomplete="username"></p>
  <p><input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password"></p>
  <button id="go" style="width:100%">Se connecter</button><div class="msg" id="lm"></div>
</div>
<div id="app" hidden>
  <div class="tabs"><button class="on" data-t="b">Réservations</button><button data-t="v">Véhicules & prix</button></div>
  <div id="tb"></div><div id="tv" hidden></div>
</div>
</main>
<script>
const sb=supabase.createClient("https://qhxbiinjlggazjvriyru.supabase.co","sb_publishable_iBU_N-N9zjURavH4GuZLxA_f_BNxE6A");
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>new Date(d).toLocaleDateString("fr-FR",{timeZone:"Africa/Tunis"});
const LAB={pending:"En attente",confirmed:"Confirmée",cancelled:"Annulée",expired:"Expirée",cancellation_requested:"Annulation demandée",blocked:"Bloquée"};

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$("login").hidden=false;$("app").hidden=true;$("out").hidden=true;return}
  const {data:p}=await sb.from("profiles").select("role").eq("id",session.user.id).single();
  if(!p||!["admin","staff"].includes(p.role)){await sb.auth.signOut();$("lm").textContent="Ce compte n'a pas accès à l'administration.";return boot()}
  $("login").hidden=true;$("app").hidden=false;$("out").hidden=false;
  await sb.rpc("expire_holds");loadB();loadV();
}
$("go").onclick=async()=>{
  $("lm").textContent="";
  const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(error){$("lm").textContent="E-mail ou mot de passe incorrect.";return}
  $("pw").value="";boot();
};
$("out").onclick=async()=>{await sb.auth.signOut();boot()};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  $("tb").hidden=b.dataset.t!=="b";$("tv").hidden=b.dataset.t!=="v";
});

async function loadB(){
  const {data,error}=await sb.from("bookings").select("*,vehicles(name)").order("created_at",{ascending:false}).limit(100);
  if(error){$("tb").innerHTML=`<div class="msg">${esc(error.message)}</div>`;return}
  $("tb").innerHTML=data.length?data.map(b=>`<div class="card"><div class="row"><b>${esc(b.vehicles?.name)}</b><span class="st ${b.status}">${LAB[b.status]}</span></div>
   <div>${esc(b.guest_name)} · <a href="tel:${esc(b.guest_phone)}">${esc(b.guest_phone)}</a></div>
   <div class="small">Du ${fmt(b.start_at)} au ${fmt(b.end_at)} · ${esc(b.quote?.days)} jours · ${esc(b.pickup_text)}${b.quote?.subtotal_htva?` · ~${esc(b.quote.subtotal_htva)} TND HTVA`:""}</div>
   ${b.status==="pending"&&b.hold_expires_at?`<div class="small">Réservation retenue jusqu'à ${new Date(b.hold_expires_at).toLocaleTimeString("fr-FR",{timeZone:"Africa/Tunis",hour:"2-digit",minute:"2-digit"})}</div>`:""}
   <div class="row" style="margin-top:8px;justify-content:flex-start">
    ${["pending","cancellation_requested"].includes(b.status)?`<button class="g" data-a="confirmed" data-id="${b.id}">Confirmer</button>`:""}
    ${["pending","confirmed","cancellation_requested"].includes(b.status)?`<button class="r" data-a="cancelled" data-id="${b.id}">Annuler</button>`:""}
   </div></div>`).join(""):`<div class="card">Aucune demande pour le moment.</div>`;
  $("tb").querySelectorAll("[data-a]").forEach(btn=>btn.onclick=()=>act(btn.dataset.id,btn.dataset.a));
}
async function act(id,status){
  if(!confirm(status==="confirmed"?"Confirmer cette réservation (après vérification du paiement) ?":"Annuler cette réservation ?"))return;
  const upd={status,updated_at:new Date().toISOString()};
  if(status==="confirmed")upd.hold_expires_at=null;
  const {error}=await sb.from("bookings").update(upd).eq("id",id);
  if(error){alert("Impossible : "+error.message);return}
  await sb.from("audit_log").insert({actor:(await sb.auth.getUser()).data.user.id,action:"booking_"+status,entity:"booking",entity_id:id});
  loadB();
}

async function loadV(){
  const {data,error}=await sb.from("vehicles").select("*").order("sort");
  if(error){$("tv").innerHTML=`<div class="msg">${esc(error.message)}</div>`;return}
  $("tv").innerHTML=`<div class="card"><p class="small">Prix journalier HTVA en TND. Pour les VIP, laissez vide = "prix sur demande". Modifiez la plaque d'immatriculation ici (aucune plaque inventée).</p>`+
   data.map(v=>`<div class="vrow" data-id="${v.id}"><div><b>${esc(v.name)}</b> <span class="small">${v.category.toUpperCase()}</span></div>
    <input class="pr" type="number" min="0" step="0.5" value="${v.daily_price_htva??""}" placeholder="Prix">
    <input class="pl" value="${esc(v.plate)}" placeholder="Plaque">
    <div><select class="sx"><option value="active"${v.status==="active"?" selected":""}>Actif</option><option value="disabled"${v.status==="disabled"?" selected":""}>Désactivé</option><option value="archived"${v.status==="archived"?" selected":""}>Archivé</option></select>
    <button class="g sv" style="margin-top:6px">Enregistrer</button></div></div>`).join("")+`</div>`;
  $("tv").querySelectorAll(".sv").forEach(btn=>btn.onclick=async()=>{
    const r=btn.closest(".vrow"),pr=r.querySelector(".pr").value;
    const {error}=await sb.from("vehicles").update({daily_price_htva:pr===""?null:+pr,plate:r.querySelector(".pl").value.trim()||null,status:r.querySelector(".sx").value}).eq("id",r.dataset.id);
    btn.textContent=error?"Erreur":"Enregistré ✓";if(error)alert(error.message);setTimeout(()=>btn.textContent="Enregistrer",1800);
  });
}
boot();
</script>
</body></html>

<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Amine Rent A Car</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--ink:#1C1F22;--red:#D62828;--green:#2FAE60;--gold:#C9A227;--line:#d9dad6}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:#F1F2F0;color:#202225}
header{background:var(--ink);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
input,select{padding:9px;border:1.5px solid var(--line);border-radius:8px;font:inherit;width:100%}
button{border:0;border-radius:8px;padding:9px 13px;font:600 14px inherit;color:#fff;background:var(--ink);cursor:pointer}
.g{background:var(--green)}.r{background:var(--red)}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{background:#fff;color:var(--ink);border:1px solid var(--line)}.tabs .on{background:var(--ink);color:#fff}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;color:#fff}
.pending{background:var(--gold);color:#000}.confirmed{background:var(--green)}.cancelled,.expired{background:#888}.cancellation_requested{background:#e67e22}.blocked{background:#555}
.msg{color:var(--red);font-weight:600;margin:8px 0}.small{color:#63676b;font-size:13px}
.ph{display:inline-block;position:relative;margin:4px 6px 0 0}.ph img{height:54px;border-radius:6px;display:block}.ph button{position:absolute;top:-6px;right:-6px;padding:0 6px;border-radius:50%;background:var(--red);font-size:12px}
.vrow{display:grid;grid-template-columns:1fr 110px 120px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
@media(max-width:700px){.vrow{grid-template-columns:1fr 1fr}}
[hidden]{display:none!important}
</style></head>
<body>
<header><b>AMINE RENT A CAR : Admin</b><button id="out" hidden>Déconnexion</button></header>
<main>
<div class="card" id="login" style="max-width:400px;margin:40px auto">
  <h2 style="margin-top:0">Connexion</h2>
  <p><input id="em" type="email" placeholder="E-mail" autocomplete="username"></p>
  <p><input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password"></p>
  <button id="go" style="width:100%">Se connecter</button><div class="msg" id="lm"></div>
</div>
<div id="app" hidden>
  <div class="tabs"><button class="on" data-t="b">Réservations</button><button data-t="v">Véhicules & prix</button><button data-t="p">Paiements & banque</button></div>
  <div id="tb"></div><div id="tv" hidden></div><div id="tp" hidden></div>
</div>
</main>
<script>
const sb=supabase.createClient("https://qhxbiinjlggazjvriyru.supabase.co","sb_publishable_iBU_N-N9zjURavH4GuZLxA_f_BNxE6A");
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>new Date(d).toLocaleDateString("fr-FR",{timeZone:"Africa/Tunis"});
const LAB={pending:"En attente",confirmed:"Confirmée",cancelled:"Annulée",expired:"Expirée",cancellation_requested:"Annulation demandée",blocked:"Bloquée"};

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$("login").hidden=false;$("app").hidden=true;$("out").hidden=true;return}
  const {data:p,error:pe}=await sb.from("profiles").select("role").eq("id",session.user.id).maybeSingle();
  if(!p||!["admin","staff"].includes(p.role)){
    const why=pe?("Erreur base de données : "+pe.message):!p?"aucun profil trouvé pour ce compte (relancer la commande SQL d'attribution après la création du compte)":("rôle actuel : "+p.role);
    await sb.auth.signOut();boot();$("lm").textContent="Connexion réussie, mais ce compte n'est pas administrateur : "+why;return}
  $("login").hidden=true;$("app").hidden=false;$("out").hidden=false;
  await sb.rpc("expire_holds");loadB();loadV();loadP();
}
$("go").onclick=async()=>{
  $("lm").textContent="";
  const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(error){$("lm").textContent="Connexion refusée : "+error.message+(error.status?" (code "+error.status+")":"");return}
  $("pw").value="";boot();
};
$("out").onclick=async()=>{await sb.auth.signOut();boot()};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  $("tb").hidden=b.dataset.t!=="b";$("tv").hidden=b.dataset.t!=="v";$("tp").hidden=b.dataset.t!=="p";
});

async function loadB(){
  const {data,error}=await sb.from("bookings").select("*,vehicles(name)").order("created_at",{ascending:false}).limit(100);
  if(error){$("tb").innerHTML=`<div class="msg">${esc(error.message)}</div>`;return}
  $("tb").innerHTML=data.length?data.map(b=>`<div class="card"><div class="row"><b>${esc(b.vehicles?.name)}</b><span class="st ${b.status}">${LAB[b.status]}</span></div>
   <div>${esc(b.guest_name)} · <a href="tel:${esc(b.guest_phone)}">${esc(b.guest_phone)}</a></div>
   <div class="small">Du ${fmt(b.start_at)} au ${fmt(b.end_at)} · ${esc(b.quote?.days)} jours · ${esc(b.pickup_text)}${b.quote?.subtotal_htva?` · ~${esc(b.quote.subtotal_htva)} TND HTVA`:""}</div>
   ${b.status==="pending"&&b.hold_expires_at?`<div class="small">Réservation retenue jusqu'à ${new Date(b.hold_expires_at).toLocaleTimeString("fr-FR",{timeZone:"Africa/Tunis",hour:"2-digit",minute:"2-digit"})}</div>`:""}
   <div class="row" style="margin-top:8px;justify-content:flex-start">
    ${["pending","cancellation_requested"].includes(b.status)?`<button class="g" data-a="confirmed" data-id="${b.id}">Confirmer</button>`:""}
    ${["pending","confirmed","cancellation_requested"].includes(b.status)?`<button class="r" data-a="cancelled" data-id="${b.id}">Annuler</button>`:""}
   </div></div>`).join(""):`<div class="card">Aucune demande pour le moment.</div>`;
  $("tb").querySelectorAll("[data-a]").forEach(btn=>btn.onclick=()=>act(btn.dataset.id,btn.dataset.a));
}
async function act(id,status){
  if(!confirm(status==="confirmed"?"Confirmer cette réservation (après vérification du paiement) ?":"Annuler cette réservation ?"))return;
  const upd={status,updated_at:new Date().toISOString()};
  if(status==="confirmed")upd.hold_expires_at=null;
  const {error}=await sb.from("bookings").update(upd).eq("id",id);
  if(error){alert("Impossible : "+error.message);return}
  await sb.from("audit_log").insert({actor:(await sb.auth.getUser()).data.user.id,action:"booking_"+status,entity:"booking",entity_id:id});
  loadB();
}

async function loadV(){
  const {data,error}=await sb.from("vehicles").select("*").order("sort");
  const {data:imgs}=await sb.from("vehicle_images").select("*").order("sort");
  const URL0="https://qhxbiinjlggazjvriyru.supabase.co/storage/v1/object/public/vehicle-images/";
  if(error){$("tv").innerHTML=`<div class="msg">${esc(error.message)}</div>`;return}
  $("tv").innerHTML=`<div class="card"><p class="small">Prix journalier HTVA en TND. Pour les VIP, laissez vide = "prix sur demande". Modifiez la plaque d'immatriculation ici (aucune plaque inventée).</p>`+
   data.map(v=>`<div class="vrow" data-id="${v.id}"><div><b>${esc(v.name)}</b> <span class="small">${v.category.toUpperCase()}</span></div>
    <input class="pr" type="number" min="0" step="0.5" value="${v.daily_price_htva??""}" placeholder="Prix">
    <input class="pl" value="${esc(v.plate)}" placeholder="Plaque">
    <div><select class="sx"><option value="active"${v.status==="active"?" selected":""}>Actif</option><option value="disabled"${v.status==="disabled"?" selected":""}>Désactivé</option><option value="archived"${v.status==="archived"?" selected":""}>Archivé</option></select>
    <button class="g sv" style="margin-top:6px">Enregistrer</button></div>
    <div style="grid-column:1/-1"><input type="file" class="up" accept="image/jpeg,image/png,image/webp" style="width:auto"> <button class="up-b">Ajouter la photo</button> <span class="small">JPG/PNG/WebP, 3 Mo max</span>
    <div>${(imgs||[]).filter(i=>i.vehicle_id===v.id).map(i=>`<span class="ph"><img src="${URL0}${esc(i.path)}" alt=""><button data-del="${i.id}" data-path="${esc(i.path)}" title="Supprimer">×</button></span>`).join("")}</div></div></div>`).join("")+`</div>`;
  $("tv").querySelectorAll(".sv").forEach(btn=>btn.onclick=async()=>{
    const r=btn.closest(".vrow"),pr=r.querySelector(".pr").value;
    const {error}=await sb.from("vehicles").update({daily_price_htva:pr===""?null:+pr,plate:r.querySelector(".pl").value.trim()||null,status:r.querySelector(".sx").value}).eq("id",r.dataset.id);
    btn.textContent=error?"Erreur":"Enregistré ✓";if(error)alert(error.message);setTimeout(()=>btn.textContent="Enregistrer",1800);
  });
  $("tv").querySelectorAll(".up-b").forEach(btn=>btn.onclick=async()=>{
    const r=btn.closest(".vrow"),f=r.querySelector(".up").files[0];
    if(!f)return alert("Choisissez d'abord une photo.");
    const ext={"image/jpeg":"jpg","image/png":"png","image/webp":"webp"}[f.type];
    if(!ext)return alert("Format non accepté (JPG, PNG ou WebP).");
    if(f.size>3*1024*1024)return alert("Photo trop lourde (3 Mo max).");
    btn.disabled=true;btn.textContent="Envoi...";
    const path=`${r.dataset.id}/${Date.now()}.${ext}`;
    const up=await sb.storage.from("vehicle-images").upload(path,f,{contentType:f.type});
    if(up.error){alert("Échec : "+up.error.message);btn.disabled=false;btn.textContent="Ajouter la photo";return}
    const ins=await sb.from("vehicle_images").insert({vehicle_id:r.dataset.id,path,alt:r.querySelector("b").textContent});
    if(ins.error)alert(ins.error.message);
    loadV();
  });
  $("tv").querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Supprimer cette photo ?"))return;
    await sb.storage.from("vehicle-images").remove([b.dataset.path]);
    await sb.from("vehicle_images").delete().eq("id",b.dataset.del);loadV();
  });
}

async function loadP(){
  const [ba,pay]=await Promise.all([sb.from("bank_accounts").select("*").order("sort"),
    sb.from("payments").select("*,bookings(guest_name,guest_phone,quote,vehicles(name))").order("created_at",{ascending:false}).limit(50)]);
  const PL={awaiting:"En attente",proof_uploaded:"Preuve reçue (à vérifier)",verified:"Vérifié",rejected:"Rejeté"};
  $("tp").innerHTML=`<div class="card"><h3 style="margin-top:0">Comptes bancaires affichés aux clients</h3>
   <p class="small">Saisissez ici le RIB officiel. Il reste dans la base de données (jamais dans le code du site).</p>
   ${(ba.data||[]).map(a=>`<div class="row" style="border-top:1px solid var(--line);padding:8px 0"><div><b>${esc(a.bank)}</b> · ${esc(a.holder)}<br><code>${esc(a.rib)}</code></div><button class="r" data-bd="${a.id}">Supprimer</button></div>`).join("")}
   <div class="vrow" style="grid-template-columns:1fr 1fr 1.4fr auto"><input id="bk" placeholder="Banque (UIB...)"><input id="bh" placeholder="Titulaire"><input id="br" placeholder="RIB"><button class="g" id="ba">Ajouter</button></div></div>
   <div class="card"><h3 style="margin-top:0">Paiements</h3><p class="small">Une capture d'écran n'est pas une preuve : vérifiez le virement sur votre compte, puis saisissez le montant réellement reçu.</p>
   ${(pay.data||[]).map(p=>`<div style="border-top:1px solid var(--line);padding:10px 0"><div class="row"><b>${esc(p.bookings?.vehicles?.name)} · ${esc(p.bookings?.guest_name)}</b><span class="st ${p.status==="verified"?"confirmed":p.status==="rejected"?"cancelled":"pending"}">${PL[p.status]}</span></div>
    <div class="small">${esc(p.bookings?.guest_phone)} · reçu : ${esc(p.amount)} TND</div>
    <div class="row" style="justify-content:flex-start;margin-top:6px">${p.proof_path?`<button data-pf="${esc(p.proof_path)}">Voir la preuve</button>`:""}
    ${p.status==="proof_uploaded"?`<input type="number" min="0" step="0.5" placeholder="Montant reçu" style="width:130px" id="am${p.id}"><button class="g" data-v="${p.id}" data-s="verified">Vérifié</button><button class="r" data-v="${p.id}" data-s="rejected">Rejeter</button>`:""}</div></div>`).join("")||"<p class='small'>Aucun paiement pour le moment.</p>"}</div>`;
  $("ba").onclick=async()=>{
    const bank=$("bk").value.trim(),holder=$("bh").value.trim(),rib=$("br").value.trim();
    if(!bank||!holder||!rib)return alert("Remplissez les 3 champs.");
    const {error}=await sb.from("bank_accounts").insert({bank,holder,rib});if(error)alert(error.message);loadP();
  };
  $("tp").querySelectorAll("[data-bd]").forEach(b=>b.onclick=async()=>{if(confirm("Supprimer ce compte ?")){await sb.from("bank_accounts").delete().eq("id",b.dataset.bd);loadP()}});
  $("tp").querySelectorAll("[data-pf]").forEach(b=>b.onclick=async()=>{
    const {data,error}=await sb.storage.from("payment-proofs").createSignedUrl(b.dataset.pf,300);
    if(error)return alert(error.message);window.open(data.signedUrl,"_blank","noopener");
  });
  $("tp").querySelectorAll("[data-v]").forEach(b=>b.onclick=async()=>{
    const st=b.dataset.s,amt=+($("am"+b.dataset.v).value||0);
    if(st==="verified"&&!(amt>0))return alert("Saisissez le montant réellement reçu.");
    if(!confirm(st==="verified"?"Confirmer que "+amt+" TND ont bien été reçus sur le compte ?":"Rejeter cette preuve ?"))return;
    const u=(await sb.auth.getUser()).data.user.id;
    const {error}=await sb.from("payments").update({status:st,amount:st==="verified"?amt:0,verified_by:u,verified_at:new Date().toISOString()}).eq("id",b.dataset.v);
    if(error)return alert(error.message);
    await sb.from("audit_log").insert({actor:u,action:"payment_"+st,entity:"payment",entity_id:b.dataset.v});loadP();
  });
}
boot();
</script>
</body></html>

$("mx").onclick=closeM;
$("m").addEventListener("click",e=>{if(e.target===$("m"))closeM()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
$("s").addEventListener("change",()=>{
  const m=new Date($("s").value);m.setDate(m.getDate()+MIN_DAYS);
  $("e").min=iso(m);if($("e").value<iso(m))$("e").value=iso(m);quote();
});
$("e").addEventListener("change",quote);

$("f").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const n=$("n").value.trim(),p=$("p").value.replace(/\s/g,""),s=$("s").value,e=$("e").value,l=$("l").value;
  const okP=/^(\+216)?[2459][0-9]{7}$/.test(p);
  const okD=s&&e&&s>=iso(new Date())&&dayDiff(s,e)>=MIN_DAYS;
  $("pe").style.display=okP?"none":"block";
  $("de").style.display=okD?"none":"block";
  if(!okP||!okD||!n){if(!n)$("n").focus();return}
  const btn=$("sb");btn.disabled=true;$("er").style.display="none";
  const vname=car.replace(" (VIP)","");
  let r;
  try{if(!SB)throw 0;const {data,error}=await SB.rpc("request_booking",{p_vehicle_name:vname,p_start:s,p_end:e,p_name:n,p_phone:p,p_location:l});r=error?{ok:false,error:"other"}:data}catch(x){r={ok:false,error:"other"}}
  btn.disabled=false;
  if(!r.ok&&r.error==="other"){const m2=`Bonjour, demande de réservation - AMINE RENT A CAR\nVéhicule : ${car}\nNom : ${n}\nTél : ${p}\nDu : ${s}  Au : ${e}\nPrise en charge : ${l}`;r={ok:true,id:"00000000",days:dayDiff(s,e),fallback:m2}}
  if(!r.ok){const k=r.error==="unavailable"?"e_unavailable":r.error==="too_many"?"e_too_many":r.error==="dates"?"dateErr":r.error==="phone"?"phoneErr":"e_other";
    $("er").textContent=t(k);$("er").style.display="block";return}
  const msg=r.fallback||`Bonjour, demande de réservation - AMINE RENT A CAR\nRéf : ${r.id.slice(0,8)}\nVéhicule : ${car}\nNom : ${n}\nTél : ${p}\nDu : ${s}  Au : ${e} (${r.days} jours)\nPrise en charge : ${l}`;
  $("wal").href=`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`;
  $("f").hidden=true;$("ok").hidden=false;
});
$("cl").onclick=closeM;
setLang("fr");
</script>
